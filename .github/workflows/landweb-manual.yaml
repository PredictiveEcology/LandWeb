## Workflow based on from https://github.com/r-lib/actions/tree/v2/examples/bookdown.yaml

name: landweb-manual

on:
  push:
    branches: [main, targets]
  pull_request:
    branches: [main, targets]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-manual-site:
    if: "!contains(github.event.commits[0].message, '[skip-ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_MRAN_ENABLED: false
      RENV_CONFIG_PAK_ENABLED: false
      RENV_PATHS_ROOT: ~/.cache/R/renv

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-tinytex@v2

      ## TODO: pin to a tag once one exists. The published v0.4/v0.5 still add the
      ## ubuntugis PPA, whose libgdal does not match what the P3M binaries were built
      ## against; only `main` has that removed.
      - uses: PredictiveEcology/actions/install-spatial-deps@main

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://predictiveecology.r-universe.dev/'
          Ncpus: 2
          r-version: 4.6.1
          use-public-rspm: false

      ## `setup-renv` restores a lockfile and does NOT resolve system requirements, unlike
      ## `setup-r-dependencies`, which delegates to pak and installs them itself. The apt
      ## list here used to be hand-written, and each omission failed the same way: a binary
      ## package installs, then fails to LOAD on a missing .so minutes later. Derive it from
      ## renv.lock instead, so it tracks the lockfile. `--vanilla` keeps renv's autoloader
      ## from bootstrapping the project library before the list has even been computed.
      - name: Install system dependencies derived from renv.lock
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          Rscript --vanilla -e 'if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv", repos = "https://cloud.r-project.org")'
          Rscript --vanilla .github/scripts/sysreqs.R renv.lock "$RUNNER_TEMP/sysreqs.txt"
          echo "::group::system dependencies derived from renv.lock"
          cat "$RUNNER_TEMP/sysreqs.txt"
          echo "::endgroup::"
          sudo -E apt-get update -y
          xargs -a "$RUNNER_TEMP/sysreqs.txt" sudo -E apt-get install -y --no-install-recommends

      - uses: r-lib/actions/setup-renv@v2
        # with:
        #   profile: '"manual"'

      ## With `output_dir` set, a SUCCESSFUL render leaves knitr's cache at
      ## manual/<book_filename>_cache/ and the figures at <book_filename>_files/ --
      ## `delete_merged_file` removes LandWeb_manual.Rmd before bookdown's on.exit runs,
      ## so nothing is stowed under `_bookdown_files`. A render that ERRORS still has
      ## that .Rmd on disk, and bookdown then moves both into manual/_bookdown_files/ --
      ## hence all three paths, so a failed build still saves a cache for the retry.
      - name: Cache bookdown results
        uses: actions/cache@v6
        with:
          path: |
            manual/*_cache
            manual/*_files
            manual/_bookdown_files
          key: bookdown-${{ hashFiles('**/*Rmd') }}
          restore-keys: bookdown-

      - name: Build LandWeb manual
        run: |
          source("manual/build.R")
        shell: Rscript {0}

      ## `targets` builds to prove the manual still renders; only `main` publishes.
      ## Without the ref guard every push to a development branch would overwrite the
      ## live site (deploy uses clean: false, so it cannot even be undone by a rebuild).
      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
