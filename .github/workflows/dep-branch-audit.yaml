name: dep-branch-audit

## Catches the failure mode where one GitHub dependency is requested at two different commits.
## pak solves a dependency request as a single problem, so one such repo makes the WHOLE solve
## fail and reports every other package as a "dependency conflict" -- which reads like a far
## bigger problem than it is, and cost several CI rounds to unpick on 2026-08-20.
##
## The schedule is not decoration: the worst instance so far needed NO local change at all.
## `FOR-CAST/workflowtools@development` silently fell 9 commits behind `main`, leaving the pin
## resolving to 0.0.13 while burnSummaries requires >= 0.0.16 for archive_extract_once(). Only a
## periodic re-resolve catches drift that happens entirely on the remote.

## `targets` is where the v3 work happens; `main` is the repo default.
## NB GitHub runs `schedule:` (and offers `workflow_dispatch:`) ONLY from the DEFAULT branch, so
## the weekly re-resolve below does not fire until this file reaches `main`.
on:
  push:
    branches: [main, targets]
    paths:
      - modules/**
      - packages/**
      - scripts/audit-dep-branches.R
      - .github/workflows/dep-branch-audit.yaml
  pull_request:
    branches: [main, targets]
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependency branches
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ## the script shells out to `gh`, which is preinstalled on the runner
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ## packages/crew.ssh is a PRIVATE repo. Declaring it here keeps a deliberate gap visibly
      ## different from an accidental one: without it the audit reports "coverage is reduced" and
      ## fails. It declares no `Remotes:` field, so nothing is actually lost -- revisit if that
      ## changes.
      AUDIT_SKIP_PATHS: packages/crew.ssh

    steps:
      ## NOT `submodules: true`: the repo-scoped GITHUB_TOKEN cannot clone the private
      ## packages/crew.ssh, and one unclonable submodule fails the whole checkout step.
      - uses: actions/checkout@v4

      ## The audit reads each module's reqdPkgs from modules/<m>/<m>.R and each local package's
      ## Remotes from packages/<p>/DESCRIPTION, so those submodules do need to be present.
      ## Initialise them one at a time and carry on past any that cannot be cloned -- the audit
      ## reports whatever it could not see rather than silently auditing less.
      - name: Check out the submodules the audit reads
        run: |
          for p in $(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}'); do
            case " $AUDIT_SKIP_PATHS " in *" $p "*) echo "skip (declared): $p"; continue ;; esac
            git submodule update --init --depth 1 -- "$p" \
              || echo "::warning title=submodule::could not initialise $p"
          done

      ## The script is pure base R + the gh CLI, so there is nothing to install beyond R itself.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Audit dependency branches
        run: Rscript scripts/audit-dep-branches.R
