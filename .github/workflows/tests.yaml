name: tests

## The suite needs only testthat, withr and yaml plus the Quarto CLI, so this job skips renv:
## restoring LandWeb's full lockfile (the spatial stack and many GitHub packages) would be a cold
## build of hours for three CRAN packages. A test that needs the project's own packages needs a
## setup-renv job instead.
on:
  push:
    branches: [main, targets]
    paths:
      - reports/**
      - _quarto.yml
      - tests/**
      - scripts/run-tests.R
      - .github/workflows/tests.yaml
  pull_request:
    branches: [main, targets]
    paths:
      - reports/**
      - _quarto.yml
      - tests/**
      - scripts/run-tests.R
      - .github/workflows/tests.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ## Skip the project .Rprofile, and so renv. This also skips the ~/.Rprofile where setup-r
      ## writes its CRAN mirror, so install.packages() below passes repos explicitly.
      R_PROFILE_USER: /dev/null

    steps:
      ## NOT `submodules: true`: nothing here needs them, and the repo-scoped token cannot clone the
      ## private packages/crew.ssh.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv              # R's version from renv.lock
          use-public-rspm: true

      ## The version the compute nodes render with: the clearpage filter depends on what the
      ## pagebreak shortcode emits, so bump this with the nodes' Quarto.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      - name: Install test packages
        run: install.packages(c("testthat", "withr", "yaml"), repos = Sys.getenv("RSPM", "https://cloud.r-project.org"))
        shell: Rscript {0}

      - name: Tests
        run: Rscript scripts/run-tests.R

      - name: Tests left the checkout untouched
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
